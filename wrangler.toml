# Cloudflare Workers 静态资源站点 + 询盘后端
# 静态 HTML 由 [assets] 直接托管；worker.js 仅接管 /api/* 动态请求。
name = "eco-paper-hook"
main = "worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "."

# —— 询盘后端所需绑定（需在 Cloudflare 控制台创建后取消注释并填写）——
# 【KV 记录存储】先创建命名空间再填 id：
# [[kv_namespaces]]
# binding = "INQUIRY_DB"
# id = "<你的KV命名空间ID>"

# 【收件邮箱 / 邮件服务 / 管理令牌】：在控制台 Settings → Secrets 中配置，
# 不要写进本文件（避免密钥入库）。变量名见 docs/INQUIRY-BACKEND-SETUP.md：
#   INQUIRY_TO_EMAIL, MAIL_API_KEY, MAIL_FROM, INQUIRY_ADMIN_TOKEN
# 本地调试可用 .dev.vars（见 .dev.vars.example），该文件已在 .gitignore 中。
